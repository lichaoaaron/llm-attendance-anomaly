[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attendance-anomaly-system"
version = "0.1.0"
description = "基于大模型的考勤异常识别与绩效辅助评估系统"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "lichao", email = "lichaoaaron@gmail.com" }]

[project.scripts]
attendance-anomaly = "attendance_anomaly.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
